services:
  - type: web
    name: pb08taxi-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENWA_BASE_URL
        value: http://localhost:2785/api
      - key: OPENWA_API_KEY
        sync: false
      - key: OPENWA_SESSION_NAME
        value: pb08-taxi
      - key: CORS_ORIGINS
        value: https://pb08taxi.vercel.app,http://localhost:5173
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: admin@pb08taxi.com
      - key: SUPPORT_PHONE
        value: "+919888079736"
      - key: SUPPORT_WHATSAPP
        value: "+919888079736"
      - key: BUSINESS_NAME
        value: "PB08 TAXI"
