    <!-- Instant Zero-Flicker Synchronous Favicon & Brand Hydration -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('pb08_site_settings_cache');
          if (raw) {
            var s = JSON.parse(raw);
            var logoUrl = s.site_logo_url || s.site_favicon_url;
            if (logoUrl) {
              var appleIcons = document.querySelectorAll("link[rel='apple-touch-icon']");
              for (var i = 0; i < appleIcons.length; i++) {
                appleIcons[i].href = logoUrl;
              }
            }
            if (s.site_favicon_url) {
              var f = document.getElementById('app-favicon');
              if (f) f.href = s.site_favicon_url;
            }
            if (s.brand_title) {
              document.title = s.brand_title + ' — One Click Book Your Ride | 24/7 Cab Service';
              var metaAppleTitle = document.querySelector("meta[name='apple-mobile-web-app-title']");
              if (metaAppleTitle) metaAppleTitle.content = s.brand_title;
              var metaAppName = document.querySelector("meta[name='application-name']");
              if (metaAppName) metaAppName.content = s.brand_title;
            }
          }
          var seoRaw = localStorage.getItem('pb08_seo_settings_cache');
          if (seoRaw) {
            var seo = JSON.parse(seoRaw);
            if (seo && seo.meta_title) {
              document.title = seo.meta_title;
            }
          }
        } catch(e) {}
      })();
    </script>
